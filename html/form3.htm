    <form><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 30%, #5d9cec, #1b3a6b, #0c182b);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            text-align: center;
            color: #ffffff;
        }

        .avatar-icon {
            width: 80px;
            height: 80px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            font-size: 38px;
            color: #ffffff;
        }

        .title {
            font-size: 22px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
            margin-bottom: 35px;
            color: rgba(255, 255, 255, 0.9);
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .input-group i {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            padding-bottom: 10px;
            margin-right: 12px;
        }

        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding-bottom: 10px;
            color: #ffffff;
            font-size: 14px;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.8);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .checkbox-container input {
            margin-right: 6px;
            accent-color: #0d2847;
            cursor: pointer;
        }

        .forgot-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: #0b223d;
            border: none;
            border-radius: 2px;
            color: #ffffff;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .login-btn:hover {
            background-color: #051424;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <div class">
            <i class="fa-regular fa-user"></i>
        </div>
        
        <h2 class="title">Customer service

        </h2>

        <form action="#">
            <div class="input-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" placeholder="Email ID" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" required>
            </div>

            <div class="options-row">
                <label class="checkbox-container">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">LOGIN</button>
        </form>
    </div>

</body>
</html> </form>
