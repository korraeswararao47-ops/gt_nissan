<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LiveNews - Live News Website</title>

    
</head>

<body>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        /* HEADER */
        header {
            background: linear-gradient(135deg, #111827, #1d4ed8);
            color: white;
            padding: 18px 6%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        .search-box {
            display: flex;
            width: 420px;
            max-width: 100%;
        }

        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            border-radius: 8px 0 0 8px;
            font-size: 15px;
        }

        .search-box button {
            padding: 12px 18px;
            border: none;
            background: #f59e0b;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 0 8px 8px 0;
        }

        .search-box button:hover {
            background: #d97706;
        }

        /* BREAKING BAR */
        .breaking {
            background: #dc2626;
            color: white;
            padding: 10px 6%;
            font-weight: bold;
            overflow: hidden;
        }

        .breaking-content {
            white-space: nowrap;
            animation: movingNews 18s linear infinite;
        }

        @keyframes movingNews {
            from {
                transform: translateX(100%);
            }

            to {
                transform: translateX(-100%);
            }
        }

        /* CATEGORY NAV */
        .categories {
            padding: 18px 6%;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            background: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .category-btn:hover,
        .category-btn.active {
            background: #2563eb;
            color: white;
            transform: translateY(-2px);
        }

        /* MAIN */
        main {
            width: 88%;
            max-width: 1400px;
            margin: auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            gap: 20px;
        }

        .top-section h1 {
            font-size: 28px;
        }

        .refresh-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh-btn:hover {
            background: #15803d;
        }

        /* NEWS GRID */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            padding-bottom: 40px;
        }

        .news-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .news-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }

        .news-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background: #ddd;
        }

        .news-content {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .source {
            color: #2563eb;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 19px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .date {
            font-size: 12px;
            color: #888;
            margin-bottom: 15px;
        }

        .read-btn {
            display: inline-block;
            text-decoration: none;
            text-align: center;
            background: #2563eb;
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: auto;
            transition: 0.3s;
        }

        .read-btn:hover {
            background: #1d4ed8;
        }

        /* LOADING */
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 20px;
            display: none;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 5px solid #ddd;
            border-top: 5px solid #2563eb;
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        /* ERROR */
        .error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 18px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
            text-align: center;
        }

        /* FOOTER */
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 30px;
        }

        footer p {
            margin: 5px;
        }

        /* RESPONSIVE */
        @media (max-width: 1000px) {
            .news-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .navbar {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }
        }

        @media (max-width: 650px) {
            .news-grid {
                grid-template-columns: 1fr;
            }

            .top-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .logo {
                font-size: 25px;
            }

            main {
                width: 92%;
            }
        }
    </style>
    <!-- HEADER -->
    <header>
        <div class="navbar">

            <div class="logo">
                Live<span>News</span>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search news..."
                >

                <button onclick="searchNews()">
                    Search
                </button>
            </div>

        </div>
    </header>

    <!-- BREAKING NEWS -->
    <div class="breaking">
        <div class="breaking-content" id="breakingText">
            🔴 Loading latest news...
        </div>
    </div>

    <!-- CATEGORIES -->
    <div class="categories">

        <button
            class="category-btn active"
            onclick="loadCategory('general', this)">
            General
        </button>

        <button
            class="category-btn"
            onclick="loadCategory('business', this)">
            Business
        </button>

        <button
            class="category-btn"
            onclick="loadCategory('technology', this)">
            Technology
        </button>

        <button
            class="category-btn"
            onclick="loadCategory('sports', this)">
            Sports
        </button>

        <button
            class="category-btn"
            onclick="loadCategory('health', this)">
            Health
        </button>

        <button
            class="category-btn"
            onclick="loadCategory('science', this)">
            Science
        </button>

        <button
            class="category-btn"
            onclick="loadCategory('entertainment', this)">
            Entertainment
        </button>

    </div>

    <!-- MAIN -->
    <main>

        <div class="top-section">

            <h1 id="pageTitle">
                🇮🇳 Latest India News
            </h1>

            <button
                class="refresh-btn"
                onclick="loadNews()">
                🔄 Refresh News
            </button>

        </div>

        <div
            class="error"
            id="errorMessage">
        </div>

        <div
            class="loading"
            id="loading">

            <div class="spinner"></div>

            Loading latest news...

        </div>

        <div
            class="news-grid"
            id="newsContainer">
        </div>

    </main>

    <!-- FOOTER -->
    <footer>

        <p>📰 LiveNews Website</p>

        <p>
            Powered by News API
        </p>

        <p>
            © 2026 LiveNews
        </p>

    </footer>
    <script>

        /* ==========================================
           YOUR NEWS API KEY
           ========================================== */

        const API_KEY = "eeb625a4008e42c98cd18cd6ce1b4aac";


        /* ==========================================
           VARIABLES
           ========================================== */

        let currentCategory = "general";


        /* ==========================================
           LOAD NEWS
           ========================================== */

        async function loadNews() {

            const newsContainer =
                document.getElementById("newsContainer");

            const loading =
                document.getElementById("loading");

            const errorMessage =
                document.getElementById("errorMessage");

            const pageTitle =
                document.getElementById("pageTitle");


            newsContainer.innerHTML = "";

            errorMessage.style.display = "none";

            loading.style.display = "block";

            pageTitle.innerText =
                "🇮🇳 Latest India " +
                capitalize(currentCategory) +
                " News";


            try {

                const url =
                    "https://newsapi.org/v2/top-headlines" +
                    "?country=in" +
                    "&category=" +
                    currentCategory +
                    "&pageSize=30";


                const response =
                    await fetch(url, {
                        headers: {
                            "X-Api-Key": API_KEY
                        }
                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Unable to load news."
                    );

                }


                displayNews(data.articles);

                updateBreakingNews(data.articles);


            }

            catch (error) {

                console.error(error);

                errorMessage.innerHTML =
                    "❌ " +
                    error.message +
                    "<br><br>" +
                    "Check your API key and internet connection.";

                errorMessage.style.display = "block";

            }

            finally {

                loading.style.display = "none";

            }

        }


        /* ==========================================
           DISPLAY NEWS
           ========================================== */

        function displayNews(articles) {

            const container =
                document.getElementById("newsContainer");


            if (!articles || articles.length === 0) {

                container.innerHTML =
                    "<h2>No news found.</h2>";

                return;

            }


            articles.forEach(article => {

                const card =
                    document.createElement("div");

                card.className = "news-card";


                const image =
                    article.urlToImage ||
                    "https://via.placeholder.com/600x350?text=No+Image";


                const title =
                    article.title ||
                    "No title available";


                const description =
                    article.description ||
                    "No description available.";


                const source =
                    article.source?.name ||
                    "Unknown Source";


                const date =
                    formatDate(article.publishedAt);


                const url =
                    article.url || "#";


                card.innerHTML = `

                    <img
                        class="news-image"
                        src="${image}"
                        alt="News image"
                        onerror="
                            this.src='https://via.placeholder.com/600x350?text=News';
                        "
                    >

                    <div class="news-content">

                        <div class="source">
                            ${source}
                        </div>

                        <h2 class="news-title">
                            ${title}
                        </h2>

                        <p class="description">
                            ${description}
                        </p>

                        <div class="date">
                            🕒 ${date}
                        </div>

                        <a
                            href="${url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="read-btn">
                            Read Full News →
                        </a>

                    </div>
                `;


                container.appendChild(card);

            });

        }


        /* ==========================================
           CATEGORY NEWS
           ========================================== */

        function loadCategory(category, button) {

            currentCategory = category;


            document
                .querySelectorAll(".category-btn")
                .forEach(btn => {

                    btn.classList.remove("active");

                });


            button.classList.add("active");


            loadNews();

        }


        /* ==========================================
           SEARCH NEWS
           ========================================== */

        async function searchNews() {

            const searchInput =
                document.getElementById("searchInput");

            const keyword =
                searchInput.value.trim();


            if (!keyword) {

                alert("Please enter a news topic.");

                return;

            }


            const newsContainer =
                document.getElementById("newsContainer");

            const loading =
                document.getElementById("loading");

            const errorMessage =
                document.getElementById("errorMessage");

            const pageTitle =
                document.getElementById("pageTitle");


            newsContainer.innerHTML = "";

            errorMessage.style.display = "none";

            loading.style.display = "block";

            pageTitle.innerText =
                "🔎 Search Results: " +
                keyword;


            try {

                const url =
                    "https://newsapi.org/v2/everything" +
                    "?q=" +
                    encodeURIComponent(keyword) +
                    "&language=en" +
                    "&sortBy=publishedAt" +
                    "&pageSize=30";


                const response =
                    await fetch(url, {
                        headers: {
                            "X-Api-Key": API_KEY
                        }
                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Search failed."
                    );

                }


                displayNews(data.articles);

                updateBreakingNews(data.articles);

            }

            catch (error) {

                errorMessage.innerHTML =
                    "❌ " +
                    error.message;

                errorMessage.style.display = "block";

            }

            finally {

                loading.style.display = "none";

            }

        }


        /* ==========================================
           ENTER KEY SEARCH
           ========================================== */

        document
            .getElementById("searchInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    searchNews();

                }

            });


        /* ==========================================
           BREAKING NEWS
           ========================================== */

        function updateBreakingNews(articles) {

            const breakingText =
                document.getElementById("breakingText");


            if (!articles || articles.length === 0) {

                breakingText.innerText =
                    "🔴 No latest news available.";

                return;

            }


            const headlines =
                articles
                .slice(0, 8)
                .map(article => article.title)
                .join("  •  ");


            breakingText.innerText =
                "🔴 BREAKING: " +
                headlines;

        }


        /* ==========================================
           DATE FORMAT
           ========================================== */

        function formatDate(date) {

            if (!date) {

                return "Date unavailable";

            }


            return new Date(date)
                .toLocaleString("en-IN", {
                    dateStyle: "medium",
                    timeStyle: "short"
                });

        }


        /* ==========================================
           CAPITALIZE
           ========================================== */

        function capitalize(text) {

            return text
                .charAt(0)
                .toUpperCase() +
                text.slice(1);

        }


        /* ==========================================
           AUTO REFRESH
           ========================================== */

        setInterval(() => {

            loadNews();

        }, 300000); // 5 minutes


        /* ==========================================
           START WEBSITE
           ========================================== */

        loadNews();

    </script>

</body>


    
</html>
