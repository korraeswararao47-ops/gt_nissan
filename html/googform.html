<!DOCTYPE html>
<html>
<head>
    <title>Form Design</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px; 
        }

        form {
            display: inline-block;
            padding: 25px;
            border: 2px solid blue;
            border-radius: 10px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightgray;
        }
    </style>
</head>
<body>

    <h1>Registration Form</h1>

    <form onsubmit="login(event)">

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">
        <br><br>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email">
        <br><br>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password">
        <br><br>

        <button type="submit">Register</button>

    </form>

    <div id="result"></div>

    <h2>Registered Users</h2>

    <table>
        <thead>
            <tr>
                <th>S.No</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Password</th>
            </tr>
        </thead>

        <tbody id="userTable">
        </tbody>
    </table>


    <script>

        // Get users from localStorage
        let users = JSON.parse(localStorage.getItem("users")) || [];

        // Display existing users when page loads
        displayUsers();


        function login(event) {

            // Stop form from refreshing the page
            event.preventDefault();

            // Get values
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            // Check empty fields
            if (name === "" || email === "" || password === "") {

                document.getElementById("result").innerHTML =
                    "Please fill in all fields.";

                return;
            }

            // Create user object
            let user = {
                name: name,
                email: email,
                password: password
            };

            // Add user to array
            users.push(user);

            // Save users in localStorage
            localStorage.setItem("users", JSON.stringify(users));

            // Display success message
            document.getElementById("result").innerHTML =
                "Registration successful!<br>" +
                "Welcome, " + name + "<br>" +
                "Total Users: " + users.length; 

            // Update table
            displayUsers();

            // Clear form
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("password").value = "";
        }

        // Function to display users in table
        function displayUsers() { 

            let table = document.getElementById("userTable");

            // Clear old table data
            table.innerHTML = "";

            // Loop through users
            for (let i = 0; i < users.length; i++) {

                let row = table.insertRow();

                row.insertCell(0).innerHTML = i + 1;
                row.insertCell(1).innerHTML = users[i].name;
                row.insertCell(2).innerHTML = users[i].email;
                row.insertCell(3).innerHTML = users[i].password;
            }
        }

    </script>

</body>
</html>
